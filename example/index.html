<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../src/helene.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css">
  <style>
    .console {
      font-family: monospace;
      margin-left: 1em;
      height: 100%;
      width: 100%;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>

  <script type="importmap">
      {"imports": {
          "acorn": "https://cdn.jsdelivr.net/npm/acorn@8.16.0/dist/acorn.mjs",
          "helene": "../src/helene.mjs",
          "highlight.js/core": "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/es/core.min.js",
          "highlight.js/languages/css": "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/es/languages/css.min.js",
          "highlight.js/languages/javascript": "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/es/languages/javascript.min.js",
          "highlight.js/languages/xml": "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/es/languages/xml.min.js",
          "simplyflow": "https://cdn.jsdelivr.net/npm/simplyflow@0.7.9/dist/simply.flow.js"
      }}
  </script>

  <style>title {display: inline}</style>
  <title>Helene: simple textarea-based code editor</title>
</head>
<body>
  <h1>Helene: simple textarea-based code editor</h1>
  <p>Editor:</p>
  <textarea id="helene" data-helene-language="html" spellcheck="false">
<div>
  <a href="#">foo
</div>
  </textarea>

  <div style="display: flex; height: 10em; position: relative;">
    <iframe id="preview"></iframe>
    <div id="previewconsole" class="console"></div>
  </div>

  <textarea id="helene2" data-helene-language="javascript" spellcheck="false">
funtion foo() {
  console.log('bar')
}
  </textarea>

  <textarea id="helene3" data-helene-language="css" spellcheck="false">
  </textarea>

<script type="module">
    import * as acorn from 'acorn'
    import hljs from 'highlight.js/core'
    import javascript from 'highlight.js/languages/javascript'
    import css from 'highlight.js/languages/css'
    import xml from 'highlight.js/languages/xml'
    import helene from 'helene'
    import 'simplyflow'

    globalThis.acorn = acorn

    hljs.registerLanguage('javascript', javascript)
    hljs.registerLanguage('css', css)
    hljs.registerLanguage('xml', xml)

    const highlighter = {
      highlight(code, language) {
        return hljs.highlight(code, {
          language: language === 'html' ? 'xml' : language,
          ignoreIllegals: true
        }).value
      }
    }

    globalThis.editor1 = helene({
        textarea: document.getElementById('helene'),
        validate: true,
        highlighter
    })

    globalThis.editor2 = helene({
        textarea: document.getElementById('helene2'),
        validate: true,
        highlighter
    })

    globalThis.editor3 = helene({
      textarea: document.getElementById('helene3'),
      validate: true,
      highlighter
    })

    const consolescript = `
console = {
  log: function(message) {
    parent.postMessage(message)
  }
}
`
  const preview = document.getElementById('preview').contentWindow
  const previewconsole = document.getElementById('previewconsole')

  window.addEventListener('message', (evt) => {
    const line = document.createElement('div')
    line.innerText = evt.data
    previewconsole.appendChild(line).scrollIntoView()
  })

  simply.state.effect(() => {
    const htmlcontent = globalThis.editor1.state.content
    const jscontent = globalThis.editor2.state.content
    const csscontent = globalThis.editor3.state.content
    const html = `<!doctype html><style>${csscontent}</style><body>${htmlcontent}<script>${jscontent}</`+`script><script>${consolescript}</`+`script></body>`
    preview.document.open()
    preview.document.write(html)
    preview.document.close()
  })

  /*
  - only update the part that changes - html / js / css - and only when valid

  */

</script>
</body>
</html>
